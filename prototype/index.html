<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGE — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-10">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-full flex items-center justify-center mb-4" style="background-color:#1E3A5F;">
        <span class="text-white text-2xl font-bold">SGE</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Sistema de Gestão de Estoque</h1>
      <p class="text-gray-500 text-sm mt-1">Faça login para continuar</p>
    </div>

    <!-- Form -->
    <form id="login-form" onsubmit="handleLogin(event)" novalidate>
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="seu@email.com"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Senha</label>
        <input
          id="password"
          type="password"
          placeholder="••••••"
          class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Error -->
      <p id="login-error" class="hidden text-red-600 text-sm mb-4 bg-red-50 border border-red-200 rounded-lg px-4 py-2">
        E-mail ou senha inválidos. Tente novamente.
      </p>

      <button
        type="submit"
        class="w-full text-white font-semibold py-2.5 rounded-lg transition-colors"
        style="background-color:#1E3A5F;"
        onmouseover="this.style.backgroundColor='#162d4a'"
        onmouseout="this.style.backgroundColor='#1E3A5F'"
      >
        Entrar
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">
      Credencial de teste: admin@estoque.com / 123456
    </p>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const error = document.getElementById('login-error');

      if (email === 'admin@estoque.com' && password === '123456') {
        error.classList.add('hidden');
        window.location.href = 'dashboard.html';
      } else {
        error.classList.remove('hidden');
        document.getElementById('password').value = '';
      }
    }
  </script>
</body>
</html>
